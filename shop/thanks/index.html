<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thank you 💋 · @foxypixiepie</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#140C0F">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%8B%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@1,9..144,600,100,1&family=DM+Sans:opsz,wght@9..40,400..700&family=Caveat:wght@600&display=swap">
<link rel="stylesheet" href="../shop.css">
<style>
  .thanks{max-width:560px;margin:0 auto;padding:24px 16px 56px;text-align:center}
  .thanks .title{font-size:clamp(44px,12vw,64px)}
  .thanks .lede{margin-left:auto;margin-right:auto}
  .mini{position:relative;width:min(70%,280px);margin:32px auto 0;aspect-ratio:var(--ar,.714);padding:3.5%;
    background:var(--paper);box-shadow:0 18px 40px rgba(0,0,0,.45);transform:rotate(-2deg)}
  .mini .photo-wrap img{object-position:50% 30%}
  .order-line{margin:22px 0 0;color:var(--muted)}
  .order-line b{color:var(--cream)}
  .actions{display:flex;flex-direction:column;gap:10px;align-items:center;margin-top:28px}
  .btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 22px;border-radius:var(--r-chip);
    background:var(--cream);color:var(--on-cream);font-weight:700;text-decoration:none}
</style>
</head>
<body>
<header class="bar">
  <a class="back" href="../">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
    Kissed prints
  </a>
</header>
<main class="thanks">
  <h1 class="title">Thank you 💋</h1>
  <p class="lede">Your print is in my kiss queue. I'll kiss it, write and sign your letter, and ship it within 7–14 days. Your receipt is on its way to your email.</p>

  <div class="mini" hidden>
    <div class="photo-wrap"><img class="photo" alt=""></div>
    <img class="kiss" src="../kiss.svg" alt="">
  </div>
  <p class="order-line" hidden></p>

  <div class="actions">
    <a class="btn" href="../../">Back to my links</a>
    <a class="text-btn" href="mailto:hello@foxypixiepie.com">Questions? hello@foxypixiepie.com</a>
  </div>
</main>

<script src="../catalog.js"></script>
<script>
  // Shows the buyer the print and kiss spot they picked, saved by shop.js just
  // before checkout. Stripe has the same details in the order's client_reference_id.
  (function () {
    var last;
    try { last = JSON.parse(localStorage.getItem('fpp:last') || 'null'); } catch (e) { last = null; }
    if (!last || Date.now() - last.at > 864e5) return;
    var still = SHOP.stills.filter(function (s) { return s.id === last.still; })[0];
    var size = SHOP.sizes.filter(function (s) { return s.id === last.size; })[0];
    if (!still || !size) return;

    var mini = document.querySelector('.mini');
    mini.style.setProperty('--ar', size.w / size.h);
    mini.querySelector('.photo').src = '../' + still.img;
    var kiss = mini.querySelector('.kiss');
    kiss.style.setProperty('--kw', Math.min(0.9, SHOP.kissWidthIn / size.w) * 100 + '%');
    if (last.kiss === 'any') { kiss.style.setProperty('--x', '68%'); kiss.style.setProperty('--y', '80%'); kiss.style.opacity = '.4'; }
    else { kiss.style.setProperty('--x', last.kiss.x + '%'); kiss.style.setProperty('--y', last.kiss.y + '%'); }
    mini.hidden = false;

    var line = document.querySelector('.order-line');
    line.innerHTML = '<b>' + size.label + ' kissed print</b>' + (last.message ? ' with your handwritten message' : '') +
      (last.kiss === 'any' ? '. I’ll pick the spot ✨' : ', kissed right where you tapped.');
    line.hidden = false;
  })();
</script>
</body>
</html>
